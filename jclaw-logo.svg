<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    J.Claw — bold lobster silhouette optimized for 40–120px
    Viewed from above: claws forward, tail down, body center
  -->

  <!-- ═══ BODY ═══ -->
  <ellipse cx="50" cy="52" rx="14" ry="20" fill="white"/>

  <!-- ═══ HEAD ═══ -->
  <ellipse cx="50" cy="32" rx="11" ry="9" fill="white"/>

  <!-- ═══ ROSTRUM (spike on head) ═══ -->
  <path d="M50 23 L50 15" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- ═══ ANTENNAE — thick, clear lines ═══ -->
  <path d="M43 26 Q30 14 18 8" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M57 26 Q70 14 82 8" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- ═══ LEFT CLAW ARM ═══ -->
  <path d="M39 40 Q26 36 18 30" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Left claw body (thick oval) -->
  <ellipse cx="13" cy="26" rx="7" ry="10" fill="white" transform="rotate(-20 13 26)"/>
  <!-- Left claw gap — open pincer effect -->
  <path d="M8 20 Q12 26 9 33" stroke="#0e0e18" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- ═══ RIGHT CLAW ARM ═══ -->
  <path d="M61 40 Q74 36 82 30" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Right claw body (thick oval) -->
  <ellipse cx="87" cy="26" rx="7" ry="10" fill="white" transform="rotate(20 87 26)"/>
  <!-- Right claw gap -->
  <path d="M92 20 Q88 26 91 33" stroke="#0e0e18" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- ═══ WALKING LEGS — bold 3 pairs per side ═══ -->
  <path d="M38 50 L26 60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 58 L24 70" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M39 65 L28 76" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M62 50 L74 60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M63 58 L76 70" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M61 65 L72 76" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ═══ TAIL FAN — 5 bold pleopods splayed downward ═══ -->
  <path d="M50 72 L42 88" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 72 L47 92" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 72 L50 94" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 72 L53 92" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 72 L58 88" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- ═══ EYES — dark voids on head ═══ -->
  <circle cx="44" cy="31" r="3.5" fill="#0e0e18"/>
  <circle cx="56" cy="31" r="3.5" fill="#0e0e18"/>
</svg>
